# Abre um PR semanal com atualizações minor/patch das dependências, agrupadas.
# Versões major (ex.: TypeScript 5 -> 7) ficam de fora: costumam quebrar o
# build e devem ser atualizadas manualmente, uma de cada vez.
# Alertas de segurança continuam chegando pelo "Dependabot security updates"
# (Settings -> Code security), independente desta configuração.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-e-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5
